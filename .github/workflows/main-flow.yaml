name: PyApp

on:
    push:
        branches:
            -main
    pull-request:
         branches:
            -main

jobs:
    Tests:
        name: Running Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5.0.0

            - name: SetUp Py
              uses: actions/setup-python@v6.0.0
              with:
                python-version: '3.13'