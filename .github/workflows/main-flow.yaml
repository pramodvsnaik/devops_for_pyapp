name: PyApp

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    unit-test:
        name: Running Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5.0.0

            - name: SetUp Py
              uses: actions/setup-python@v6.0.0
              with:
                python-version: '3.13'
                pip-install: uv
                
            - name: astral-sh/setup-uv
              uses: astral-sh/setup-uv@v8.2.0

            - name: Install dependencies
              run: uv sync --locked --dev

            - name: run tests
              run: uv run pytest 
                 
            
